<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบจำลองปลายภาค ชีววิทยา ม.ปลาย</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Segoe UI",Tahoma,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#dbeafe,#ede9fe,#fce7f3,#e0f2fe);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    color:#1e293b;
    padding:20px;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.header{
    background:rgba(255,255,255,.9);
    border-radius:24px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 35px rgba(80,70,120,.15);
    margin-bottom:18px;
}

.header h1{
    color:#5b4b8a;
    font-size:28px;
    margin-bottom:8px;
}

.header p{
    color:#64748b;
    font-size:15px;
}

.info{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:15px;
}

.info span{
    background:#f1f5f9;
    padding:8px 15px;
    border-radius:20px;
    font-size:14px;
}

.progress-box{
    background:white;
    padding:15px 20px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 6px 20px rgba(80,70,120,.1);
}

.progress-text{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-size:14px;
}

.progress{
    width:100%;
    height:10px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#8b5cf6,#ec4899);
    transition:.3s;
}

.quiz-card{
    background:rgba(255,255,255,.95);
    border-radius:24px;
    padding:28px;
    box-shadow:0 10px 35px rgba(80,70,120,.15);
}

.question-number{
    color:#8b5cf6;
    font-weight:bold;
    margin-bottom:10px;
}

.question{
    font-size:22px;
    font-weight:700;
    line-height:1.6;
    margin-bottom:20px;
}

.choice{
    width:100%;
    border:2px solid #e2e8f0;
    background:#fff;
    padding:15px 18px;
    margin:10px 0;
    border-radius:15px;
    text-align:left;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.choice:hover{
    border-color:#a78bfa;
    background:#faf5ff;
    transform:translateY(-1px);
}

.choice.correct{
    border-color:#22c55e;
    background:#dcfce7;
}

.choice.wrong{
    border-color:#ef4444;
    background:#fee2e2;
}

.choice:disabled{
    cursor:default;
}

.explanation{
    display:none;
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    background:#f8fafc;
    border-left:6px solid #8b5cf6;
    line-height:1.8;
}

.explanation.show{
    display:block;
}

.result-title{
    font-size:20px;
    font-weight:bold;
    color:#5b4b8a;
    margin-bottom:8px;
}

.memory{
    margin-top:15px;
    padding:15px;
    background:#fff7ed;
    border-radius:14px;
    border:1px solid #fed7aa;
}

.memory b{
    color:#ea580c;
}

.next-btn,
.restart-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:15px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:18px;
}

.next-btn{
    background:linear-gradient(90deg,#8b5cf6,#ec4899);
    color:white;
}

.restart-btn{
    background:#5b4b8a;
    color:white;
}

.next-btn:hover,
.restart-btn:hover{
    opacity:.9;
}

.final{
    display:none;
}

.final-score{
    text-align:center;
    font-size:45px;
    font-weight:bold;
    color:#7c3aed;
    margin:20px 0;
}

.wrong-list{
    margin-top:20px;
}

.wrong-item{
    background:#fff1f2;
    border-left:5px solid #ef4444;
    padding:15px;
    border-radius:12px;
    margin:10px 0;
    line-height:1.7;
}

.good{
    background:#ecfdf5;
    border-left:5px solid #22c55e;
    padding:18px;
    border-radius:14px;
    line-height:1.7;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .header h1{
        font-size:23px;
    }

    .quiz-card{
        padding:20px;
    }

    .question{
        font-size:19px;
    }

    .choice{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>🧬 ข้อสอบจำลองปลายภาค ชีววิทยา</h1>
    <p>ระบบต่อมไร้ท่อ + ระบบสืบพันธุ์</p>

    <div class="info">
        <span>📚 40 ข้อ</span>
        <span>🔘 3 ตัวเลือก</span>
        <span>📝 มีคำอธิบาย</span>
        <span>💡 มีวิธีจำ</span>
    </div>
</div>

<div class="progress-box">
    <div class="progress-text">
        <span id="progressText">ข้อ 1 / 40</span>
        <span id="scoreText">คะแนน 0</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<div class="quiz-card" id="quizCard">

    <div class="question-number" id="questionNumber"></div>

    <div class="question" id="question"></div>

    <div id="choices"></div>

    <div class="explanation" id="explanation">
        <div class="result-title" id="resultTitle"></div>
        <div id="explanationText"></div>

        <div class="memory">
            <b>💡 วิธีจำก่อนสอบ</b>
            <div id="memoryText"></div>
        </div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">
        ข้อต่อไป →
    </button>

</div>

<div class="quiz-card final" id="finalCard">

    <h2 style="text-align:center;color:#5b4b8a;">
        🎉 ทำข้อสอบครบแล้ว!
    </h2>

    <div class="final-score" id="finalScore"></div>

    <div id="finalMessage"></div>

    <div class="wrong-list" id="wrongList"></div>

    <button class="restart-btn" onclick="startQuiz()">
        🔄 เริ่มทำใหม่ / สุ่มข้อใหม่
    </button>

</div>

</div>

<script>

const questionBank = [

{
q:"ฮอร์โมน (Hormone) คืออะไร?",
c:[
"สารเคมีที่สร้างจากต่อมไร้ท่อหรืออวัยวะบางส่วน และส่งไปยังเซลล์เป้าหมาย",
"สารอาหารที่ใช้สร้างพลังงานให้เซลล์",
"สารที่สร้างจากเม็ดเลือดแดงเพื่อขนส่งออกซิเจน"
],
a:0,
e:"ฮอร์โมนเป็นสารเคมีที่สร้างจากต่อมไร้ท่อและอวัยวะบางอวัยวะ แล้วถูกลำเลียงผ่านระบบหมุนเวียนเลือดไปยังเซลล์หรืออวัยวะเป้าหมายที่มีตัวรับจำเพาะ ฮอร์โมนจึงออกฤทธิ์ได้เฉพาะเซลล์ที่มี receptor ที่เหมาะสม",
m:"จำว่า “ฮอร์โมน = สารเคมี → เลือด → เป้าหมาย”"
},

{
q:"ข้อใดเป็นกลุ่มสเตียรอยด์ฮอร์โมน (Steroid hormone)?",
c:[
"Estrogen, Progesterone และ Testosterone",
"FSH, LH และ ADH",
"Insulin, Glucagon และ GH"
],
a:0,
e:"สเตียรอยด์ฮอร์โมนสังเคราะห์จากคอเลสเทอรอลและละลายในไขมัน ตัวอย่างสำคัญคือ estrogen, progesterone และ testosterone รวมถึงฮอร์โมนหลายชนิดจากต่อมหมวกไตชั้นนอก",
m:"จำว่า “Steroid → Cholesterol → ฮอร์โมนเพศ”"
},

{
q:"ฮอร์โมนประสาท (Neurohormone) ตามเนื้อหาในไฟล์สร้างจากบริเวณใด?",
c:[
"ไฮโพทาลามัส",
"ต่อมไทรอยด์",
"ตับอ่อน"
],
a:0,
e:"ฮอร์โมนประสาทสร้างจากเซลล์ประสาทที่สามารถหลั่งฮอร์โมนได้ หรือ neurosecretory cell โดยในเนื้อหานี้กล่าวถึงไฮโพทาลามัสเป็นแหล่งสำคัญ ซึ่งทำหน้าที่ควบคุมการหลั่งฮอร์โมนของต่อมใต้สมอง",
m:"จำว่า “Hypothalamus = ผู้ควบคุมต่อมใต้สมอง”"
},

{
q:"ต่อมใต้สมองแบ่งออกเป็นกี่ส่วน?",
c:[
"3 ส่วน ได้แก่ ส่วนหน้า ส่วนกลาง และส่วนหลัง",
"2 ส่วน ได้แก่ ส่วนหน้าและส่วนหลังเท่านั้น",
"4 ส่วน ได้แก่ หน้า กลาง หลัง และล่าง"
],
a:0,
e:"ต่อมใต้สมองแบ่งเป็น 3 ส่วน คือ anterior pituitary หรือส่วนหน้า, intermediate lobe หรือส่วนกลาง และ posterior pituitary หรือส่วนหลัง โดยไฟล์ระบุว่าส่วนกลางไม่มีผลต่อการทำงานในมนุษย์",
m:"จำง่าย ๆ “หน้า–กลาง–หลัง = 3”"
},

{
q:"ต่อมใต้สมองส่วนหน้ามีลักษณะสำคัญอย่างไร?",
c:[
"สร้างฮอร์โมนได้เอง และถูกควบคุมโดยฮอร์โมนจากไฮโพทาลามัส",
"สร้างฮอร์โมนไม่ได้เลย",
"ทำหน้าที่เก็บปัสสาวะ"
],
a:0,
e:"ต่อมใต้สมองส่วนหน้า (anterior pituitary) สามารถสร้างฮอร์โมนได้เอง แต่การหลั่งฮอร์โมนถูกควบคุมโดยฮอร์โมนจากไฮโพทาลามัส เช่น GnRH, GHRH, TRH และ CRH",
m:"จำว่า “หน้า = ผลิตเอง แต่ Hypothalamus สั่ง”"
},

{
q:"ต่อมใต้สมองส่วนหลังมีหน้าที่สำคัญอย่างไร?",
c:[
"เก็บและหลั่งฮอร์โมนประสาทที่สร้างจากไฮโพทาลามัส",
"สร้าง estrogen",
"สร้าง cortisol"
],
a:0,
e:"ต่อมใต้สมองส่วนหลังไม่สามารถสร้างฮอร์โมนเอง แต่มีปลายแอกซอนของเซลล์ประสาทจากไฮโพทาลามัสมาสิ้นสุดที่บริเวณนี้ เพื่อส่งและหลั่งฮอร์โมนเข้าสู่กระแสเลือด",
m:"จำว่า “หลัง = ไม่สร้าง แต่รับมาจากสมองแล้วปล่อย”"
},

{
q:"GHRH จากไฮโพทาลามัสทำหน้าที่อะไร?",
c:[
"กระตุ้นการสร้างและหลั่ง GH",
"ยับยั้ง GH",
"กระตุ้นการสร้าง insulin"
],
a:0,
e:"GHRH ย่อมาจาก Growth Hormone-Releasing Hormone ทำหน้าที่กระตุ้นต่อมใต้สมองส่วนหน้าให้สร้างและหลั่ง Growth Hormone หรือ GH",
m:"ตัว R ใน Releasing = กระตุ้นให้ปล่อย"
},

{
q:"ฮอร์โมนใดจากต่อมใต้สมองส่วนหน้ากระตุ้นการตกไข่?",
c:[
"LH",
"ADH",
"GH"
],
a:0,
e:"LH หรือ Luteinizing Hormone มีบทบาทสำคัญในเพศหญิง โดยกระตุ้นการตกไข่ และทำให้ follicle เปลี่ยนเป็น corpus luteum ซึ่งหลั่ง progesterone และ estrogen",
m:"จำว่า “LH = Launch ไข่” คือช่วยให้ไข่ตก"
},

{
q:"FSH ในเพศชายมีหน้าที่สำคัญอย่างไร?",
c:[
"กระตุ้นหลอดสร้างอสุจิให้สร้างอสุจิ",
"กระตุ้นการตกไข่",
"กระตุ้นต่อมไทรอยด์"
],
a:0,
e:"FSH ในเพศชายกระตุ้นการเจริญเติบโตของอัณฑะและหลอดสร้างอสุจิ ทำให้เกิดการสร้างอสุจิ ส่วน LH จะกระตุ้นเซลล์ Leydig ให้หลั่ง testosterone",
m:"จำคู่เพศชาย: “FSH = สร้าง Sperm, LH = สร้าง Testosterone”"
},

{
q:"ถ้าร่างกายขาด ADH จะมีแนวโน้มเกิดอะไรขึ้น?",
c:[
"ปัสสาวะมากและเจือจาง",
"ปัสสาวะน้อยมาก",
"ระดับแคลเซียมในเลือดสูงทันที"
],
a:0,
e:"ADH หรือ antidiuretic hormone ช่วยควบคุมการดูดน้ำกลับของไต หาก ADH ต่ำ การดูดน้ำกลับลดลง ทำให้มีน้ำออกทางปัสสาวะมากขึ้น",
m:"จำว่า “ADH = Anti-Diuretic = ต่อต้านการปัสสาวะ” ดังนั้นมีน้อย → ปัสสาวะมาก"
},

{
q:"ฮอร์โมนใดเกี่ยวข้องกับการหดตัวของมดลูก?",
c:[
"Oxytocin",
"Insulin",
"Thyroxine"
],
a:0,
e:"Oxytocin เป็นฮอร์โมนที่เกี่ยวข้องกับการหดตัวของกล้ามเนื้อมดลูก และมีบทบาทในกระบวนการคลอด",
m:"จำว่า “Oxytocin = ออกซิ → ช่วยออกลูก”"
},

{
q:"ต่อมหมวกไตแบ่งออกเป็นกี่ส่วน?",
c:[
"2 ส่วน คือ cortex และ medulla",
"3 ส่วน คือ หน้า กลาง หลัง",
"4 ส่วน คือ cortex 2 ชั้น และ medulla 2 ชั้น"
],
a:0,
e:"ต่อมหมวกไต (adrenal gland) อยู่เหนือไตทั้งสองข้าง แบ่งเป็น adrenal cortex หรือชั้นนอก และ adrenal medulla หรือชั้นใน",
m:"จำว่า “Adrenal = นอก Cortex / ใน Medulla”"
},

{
q:"Aldosterone สร้างจากบริเวณใด?",
c:[
"ต่อมหมวกไตชั้นนอก",
"ต่อมหมวกไตชั้นใน",
"ต่อมไทรอยด์"
],
a:0,
e:"Aldosterone เป็น mineralocorticoid จาก adrenal cortex มีหน้าที่สำคัญเกี่ยวกับสมดุลน้ำและแร่ธาตุ โดยช่วยให้ไตดูดกลับโซเดียมและน้ำ",
m:"จำว่า “Aldosterone = เก็บเกลือ → น้ำตามมา”"
},

{
q:"Cortisol สร้างจากส่วนใดของต่อมหมวกไต?",
c:[
"Adrenal cortex",
"Adrenal medulla",
"ต่อมพาราไทรอยด์"
],
a:0,
e:"Cortisol เป็น glucocorticoid จาก adrenal cortex มีบทบาทในการเพิ่มระดับน้ำตาลในเลือดและช่วยให้ร่างกายตอบสนองต่อความเครียดระยะยาว",
m:"จำว่า “Cortisol = Cortex”"
},

{
q:"หาก glucocorticoid หรือ cortisol สูงมากเกินไป อาจเกิดโรคใด?",
c:[
"Cushing’s syndrome",
"Diabetes insipidus",
"Simple goiter"
],
a:0,
e:"ในไฟล์ระบุว่าการหลั่ง glucocorticoid มากเกินไปทำให้เกิด Cushing’s syndrome โดยอาจพบลักษณะใบหน้ากลมและไขมันสะสมบริเวณต้นคอ รวมถึงระดับน้ำตาลในเลือดสูงและกล้ามเนื้ออ่อนแรง",
m:"จำว่า “Cortisol มาก → Cushing”"
},

{
q:"โรคที่มีลักษณะใบหน้ากลมและมีไขมันสะสมบริเวณลำตัวร่วมกับแขนขาเล็ก สัมพันธ์กับฮอร์โมนใด?",
c:[
"Cortisol สูงเกินไป",
"ADH ต่ำ",
"Calcitonin สูง"
],
a:0,
e:"ลักษณะที่โจทย์ถามสัมพันธ์กับ Cushing’s syndrome ซึ่งเกิดจาก glucocorticoid สูงเกินไป โดย cortisol มีผลต่อเมแทบอลิซึมของคาร์โบไฮเดรต โปรตีน และไขมัน",
m:"จำเป็นชุด “Cortisol ↑ → Cushing → moon face/ไขมันผิดปกติ”"
},

{
q:"Thyroxine มีความเกี่ยวข้องกับลูกอ๊อดอย่างไร?",
c:[
"กระตุ้น metamorphosis ให้ลูกอ๊อดพัฒนาเป็นกบ",
"ทำให้ลูกอ๊อดหยุดเจริญทันที",
"ทำให้ลูกอ๊อดสร้างไข่"
],
a:0,
e:"Thyroxine จากต่อมไทรอยด์เกี่ยวข้องกับ metamorphosis ของสัตว์สะเทินน้ำสะเทินบก หาก thyroxine มากเกินไปจะเร่ง metamorphosis ทำให้ลูกอ๊อดกลายเป็นกบเร็วขึ้น",
m:"จำว่า “Thyroxine = เปลี่ยนร่างลูกอ๊อด”"
},

{
q:"ถ้า thyroxine ของลูกอ๊อดมีน้อยเกินไป จะเกิดอะไรขึ้น?",
c:[

let questions=[];
let current=0;
let score=0;
let answered=false;
let wrongAnswers=[];

function shuffle(array){
    return array.sort(()=>Math.random()-0.5);
}

function startQuiz(){

    questions=shuffle([...questionBank]).map(q=>{
        let choices=q.c.map((text,index)=>({
            text:text,
            correct:index===q.a
        }));

        shuffle(choices);

        return{
            q:q.q,
            choices:choices,
            e:q.e,
            m:q.m
        };
    });

    current=0;
    score=0;
    answered=false;
    wrongAnswers=[];

    document.getElementById("quizCard").style.display="block";
    document.getElementById("finalCard").style.display="none";

    showQuestion();
}

function showQuestion(){

    answered=false;

    const q=questions[current];

    document.getElementById("questionNumber").textContent=
        "ข้อที่ "+(current+1);

    document.getElementById("question").textContent=q.q;

    document.getElementById("progressText").textContent=
        "ข้อ "+(current+1)+" / "+questions.length;

    document.getElementById("scoreText").textContent=
        "คะแนน "+score;

    document.getElementById("progressBar").style.width=
        ((current)/questions.length*100)+"%";

    const choices=document.getElementById("choices");

    choices.innerHTML="";

    q.choices.forEach((choice,index)=>{

        const button=document.createElement("button");

        button.className="choice";
        button.textContent=
            String.fromCharCode(65+index)+". "+choice.text;

        button.onclick=()=>answerQuestion(index);

        choices.appendChild(button);
    });

    document.getElementById("explanation").classList.remove("show");
    document.getElementById("nextBtn").style.display="none";
}

function answerQuestion(index){

    if(answered)return;

    answered=true;

    const q=questions[current];
    const buttons=document.querySelectorAll(".choice");

    buttons.forEach((button,i)=>{
        button.disabled=true;

        if(q.choices[i].correct){
            button.classList.add("correct");
        }
    });

    const selected=q.choices[index];

    if(selected.correct){

        score++;

        document.getElementById("resultTitle").textContent=
            "✅ ถูกต้อง!";

        document.getElementById("resultTitle").style.color="#16a34a";

    }else{

        selected && buttons[index].classList.add("wrong");

        document.getElementById("resultTitle").textContent=
            "❌ ยังไม่ถูก";

        document.getElementById("resultTitle").style.color="#dc2626";

        wrongAnswers.push({
            question:q.q,
            answer:q.choices.find(c=>c.correct).text,
            explanation:q.e
        });
    }

    document.getElementById("explanationText").textContent=q.e;
    document.getElementById("memoryText").textContent=q.m;

    document.getElementById("explanation").classList.add("show");

    document.getElementById("scoreText").textContent=
        "คะแนน "+score;

    document.getElementById("nextBtn").style.display="block";

    if(current===questions.length-1){
        document.getElementById("nextBtn").textContent=
            "ดูผลคะแนน 🎯";
    }
}

function nextQuestion(){

    if(!answered)return;

    if(current<questions.length-1){

        current++;
        showQuestion();

    }else{

        showFinal();
    }
}

function showFinal(){

    document.getElementById("quizCard").style.display="none";
    document.getElementById("finalCard").style.display="block";

    document.getElementById("finalScore").textContent=
        score+" / "+questions.length;

    const percent=(score/questions.length)*100;

    let message="";

    if(percent>=80){

        message=`
        <div class="good">
        🌟 ทำได้ดีมาก! พื้นฐานเนื้อหาค่อนข้างแน่นแล้ว
        <br>
        ก่อนสอบจริงลองทบทวนข้อที่ผิดอีกครั้งเพื่อเก็บรายละเอียด
        </div>
        `;

    }else if(percent>=60){

        message=`
        <div class="good">
        👍 อยู่ในระดับที่ดี แต่ควรทบทวนข้อที่ผิด โดยเฉพาะคำศัพท์และลำดับกระบวนการ
        </div>
        `;

    }else{

        message=`
        <div class="wrong-item">
        📚 ควรทบทวนเนื้อหาอีกหนึ่งรอบ แล้วลองทำใหม่
        โดยเฉพาะเรื่องฮอร์โมนและลำดับการสร้างเซลล์สืบพันธุ์
        </div>
        `;
    }

    document.getElementById("finalMessage").innerHTML=message;

    const wrongList=document.getElementById("wrongList");

    wrongList.innerHTML="";

    if(wrongAnswers.length===0){

        wrongList.innerHTML=`
        <div class="good">
        🎉 ไม่มีข้อผิดเลย! ลองกดเริ่มใหม่เพื่อสุ่มชุดข้อสอบอีกครั้ง
        </div>
        `;

    }else{

        wrongList.innerHTML=
            "<h3 style='margin-bottom:10px;'>📌 ข้อที่ควรกลับไปทบทวน</h3>";

        wrongAnswers.forEach((item,index)=>{

            const div=document.createElement("div");

            div.className="wrong-item";

            div.innerHTML=`
                <b>${index+1}. ${item.question}</b>
                <br>
                <span>คำตอบที่ถูก: <b>${item.answer}</b></span>
                <br>
                <span>${item.explanation}</span>
            `;

            wrongList.appendChild(div);
        });
    }
}

startQuiz();

</script>
